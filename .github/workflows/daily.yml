name: Update site every morning

on:
  schedule:
    - cron: "0 13 * * *"      # 13:00 UTC = 9am Eastern in summer, 8am in winter
  workflow_dispatch: {}        # lets you press "Run workflow" by hand

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore saved player data
        uses: actions/cache@v4
        with:
          path: data/nba.sqlite
          key: nba-db-${{ github.run_id }}
          restore-keys: nba-db-

      - name: Build today's list
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m app.cli run --notify

      - name: Keep a history of past days
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add web/data web/img
          git diff --cached --quiet || (git commit -m "Update list $(date -u +%F)" && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
